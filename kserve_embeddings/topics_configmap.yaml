apiVersion: v1
kind: ConfigMap
metadata:
  name: topic-detector-config
data:
  topics.yaml: |
    # REQUIRED: KServe embedding service endpoint (OpenAI-compatible /openai/v1/embeddings)
    embedding_service_url: "https://INSERT_ME/openai/v1/embeddings"

    # REQUIRED: Model name for embedding API
    model_name: "embedding-detector"

    # REQUIRED: Similarity threshold - minimum similarity to closest on-topic example (0.0 to 1.0)
    threshold: 0.65

    # OPTIONAL: Request timeout in seconds (default: 30)
    timeout: 10

    # OPTIONAL: Auth token file - if specified, will use this token when request doesn't provide one
    # Mount a Secret to /secrets/embedding-token and reference it here
    auth_token_file: "/secrets/embedding-token/token"

    # Define on-topic examples
    on_topic_examples:
      bodybuilding:
        - "what is the best way to build muscle"
        - "how to increase bicep size"
        - "top exercises for chest growth"
        - "protein supplements for gains"
        - "Arnold Schwarzenegger workout routine"
        - "want to get bigger arms"

      nfl:
        - "who won the super bowl last year"
        - "why did patriots trade Mac Jones"
        - "show me the best plays from last nfl season"
        - "Tom Brady is the greatest quarterback"
        - "Patrick Mahomes stats this season"
        - "NFL playoff predictions"
        - "football game highlights"

      cooking:
        - "how to bake a chocolate cake"
        - "best way to cook pasta"
        - "tips for making perfect sushi"
        - "Italian recipes with tomatoes"
        - "Gordon Ramsay cooking techniques"
        - "my lasagna turned out great"

      coffee:
        - "how to brew the perfect cup of coffee"
        - "best coffee beans for espresso"
        - "tips for making latte art"
        - "French press vs pour over"
        - "Starbucks new seasonal drinks"
        - "love my morning cappuccino"
