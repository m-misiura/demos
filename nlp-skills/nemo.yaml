apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: nemo
spec:
  nemoConfigs:
    - name: plain-model              # just model + instructions, no rails
      configMaps:
        - config-plain-model
    - name: self-check               # + self check input/output
      configMaps:
        - config-self-check
    - name: content-safety           # + content safety via dedicated model
      configMaps:
        - config-content-safety
    - name: pii                      # + PII detection via Presidio
      configMaps:
        - config-pii
    - name: regex                    # + regex pattern matching
      configMaps:
        - config-regex
    - name: custom-actions           # + custom actions (forbidden words, language, length)
      default: true
      configMaps:
        - config-custom-actions
  env:
    - name: LLM_API_BASE
      valueFrom:
        secretKeyRef:
          name: llm-secret
          key: api-base
    - name: LLM_MODEL_NAME
      valueFrom:
        secretKeyRef:
          name: llm-secret
          key: model-name
    - name: LLM_API_KEY
      valueFrom:
        secretKeyRef:
          name: llm-secret
          key: api-key
    - name: CONTENT_SAFETY_API_BASE
      valueFrom:
        secretKeyRef:
          name: llm-secret
          key: content-safety-api-base
    - name: CONTENT_SAFETY_MODEL_NAME
      valueFrom:
        secretKeyRef:
          name: llm-secret
          key: content-safety-model-name
    - name: CONTENT_SAFETY_API_KEY
      valueFrom:
        secretKeyRef:
          name: llm-secret
          key: content-safety-api-key
