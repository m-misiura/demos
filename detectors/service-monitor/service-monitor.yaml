apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llama-prompt-guard-2-86m-detector-metrics
  labels:
    app: guardrails-detector
    trustyai/guardrails: 'true'
spec:
  selector:
    matchLabels:
      # KServe automatically adds this label to the predictor service
      serving.kserve.io/inferenceservice: llama-prompt-guard-2-86m-detector
  endpoints:
    - port: http  # KServe predictor service port name
      path: /metrics
      interval: 30s  # Scrape every 30 seconds
      scheme: http
      # Optional: Add relabeling if you want to customize metric labels
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
