data:
  guidellm.yaml: |
    id: guidellm
    name: GuideLLM
    title: GuideLLM
    description: Performance benchmarking framework for LLM inference servers
    runtime:
      k8s:
        image: quay.io/evalhub/community-guidellm:latest
        entrypoint:
        - python
        - main.py
        cpu_request: 100m
        memory_request: 128Mi
        cpu_limit: 1000m
        memory_limit: 2Gi
      local:
        command: 'true'
    benchmarks:
    - id: sweep
      name: Auto-discover optimal load
      description: Automatically sweeps from low to high concurrency to find the best throughput-latency tradeoff.
      category: performance
      metrics:
      - requests_per_second
      - prompt_tokens_per_second
      - output_tokens_per_second
      - mean_ttft_ms
      - mean_itl_ms
      tags:
      - performance
      - throughput
      - latency
      - guidellm
      - auto
      primary_score:
        metric: output_tokens_per_second
        lower_is_better: false
      pass_criteria:
        threshold: 10.0
    - id: throughput
      name: Maximum throughput discovery
      description: Finds the server's maximum requests-per-second by gradually increasing load until saturation.
      category: performance
      metrics:
      - requests_per_second
      - prompt_tokens_per_second
      - output_tokens_per_second
      - mean_ttft_ms
      - mean_itl_ms
      tags:
      - performance
      - throughput
      - guidellm
