apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: kube-rbac-proxy
    app.kubernetes.io/created-by: trustyai-service-operator
    app.kubernetes.io/instance: controller-manager-metrics-service
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: service
    app.kubernetes.io/part-of: trustyai
    control-plane: controller-manager
  name: trustyai-service-operator-controller-manager-metrics-service
  namespace: redhat-ods-applications
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: https
  selector:
    app.kubernetes.io/part-of: trustyai
    control-plane: controller-manager
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/created-by: trustyai-service-operator
    app.kubernetes.io/instance: metrics-service
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: trustyai
    control-plane: controller-manager
  name: trustyai-service-operator-metrics-service
  namespace: redhat-ods-applications
spec:
  ports:
  - name: metrics
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app.kubernetes.io/part-of: trustyai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: trustyai-service-operator
    app.kubernetes.io/instance: trustyai-service-operator-controller-manager
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: deployment
    app.kubernetes.io/part-of: trustyai
    control-plane: controller-manager
  name: trustyai-service-operator-controller-manager
  namespace: redhat-ods-applications
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: trustyai
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/part-of: trustyai
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --leader-elect
        - --enable-services
        - TAS,LMES,GORCH,NEMO_GUARDRAILS,EVALHUB
        command:
        - /manager
        env:
        - name: GOMEMLIMIT
          value: 630MiB
        image: quay.io/trustyai/trustyai-service-operator:latest
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 900m
            memory: 700Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: trustyai-service-operator-controller-manager
      terminationGracePeriodSeconds: 10
---
apiVersion: monitoring.coreos.com/v1
