apiVersion: v1
kind: ConfigMap
metadata:
  name: hf-classifier-config
data:
  config.yaml: |
    config_id: hf-classifier-test

    models:
      - type: main
        engine: openai
        model: ${LLM_MODEL_NAME}
        parameters:
          base_url: ${LLM_API_BASE}
          max_tokens: 4096

    rails:
      config:
        hf_classifier:
          hap:
            engine: fms
            model: hap-detector
            base_url: ${HAP_ENDPOINT}
            api_key_env_var: OC_TOKEN
            threshold: 0.5
            blocked_labels:
              - "LABEL_1"
            parameters:
              verify_ssl: false

          prompt_injection:
            engine: kserve
            model: prompt-injection-detector
            base_url: ${PROMPT_INJECTION_ENDPOINT}
            api_key_env_var: OC_TOKEN
            threshold: 0.5
            blocked_labels:
              - "1"
            parameters:
              verify_ssl: false

          lang:
            engine: vllm
            model: language-classifier
            base_url: ${LANG_ENDPOINT}
            api_key_env_var: OC_TOKEN
            threshold: 0.5
            blocked_labels:
              - "fr"
              - "de"
              - "es"
              - "pt"
              - "it"
              - "nl"
              - "pl"
              - "ru"
              - "ja"
              - "zh"
              - "ko"
              - "ar"
              - "hi"
              - "tr"
              - "vi"
              - "sv"
              - "da"
              - "fi"
              - "no"
            parameters:
              verify_ssl: false

          ner:
            engine: local
            model: dslim/distilbert-NER
            task: token-classification
            threshold: 0.7
            blocked_labels:
              - "PER"
              - "LOC"
              - "ORG"
            parameters:
              aggregation_strategy: simple

      input:
        flows:
          - hf classifier check input $classifier=lang
          - hf classifier check input $classifier=prompt_injection
          - hf classifier check input $classifier=hap
          - hf classifier check input $classifier=ner
        parallel: true
      output:
        flows:
          - hf classifier check output $classifier=hap
          - hf classifier check output $classifier=ner
  rails.co: |
    # Using built-in hf_classifier rails
